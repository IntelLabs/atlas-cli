[tool.poetry]
name = "atlas-test-framework"
version = "0.1.0"
description = "Test framework for Atlas CLI provenance and integrity testing"
authors = ["Marcin Spoczynski <marcin.spoczynski@intel.com>"]
readme = "README.md"
packages = [{include = "atlas_test"}]

[tool.poetry.dependencies]
python = "^3.8"
pyyaml = "^6.0.1"
click = "^8.1.7"
colorama = "^0.4.6"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
black = "^23.11.0"
mypy = "^1.7.1"

[tool.poetry.scripts]
atlas-test = "atlas_test.runner:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"