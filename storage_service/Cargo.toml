[package]
name = "c2pa_storage_service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.4"
mongodb = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.9"
mime = "0.3"            # For MIME type handling
bytes = "1.0"           # For handling raw bytes
ring = "0.16"           # Cryptography for hashing and signing
base64 = "0.21"         # For encoding binary data
parking_lot = "0.12"    # Better RwLock implementation